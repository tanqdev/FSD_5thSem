<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <style>
      body {
        color: rgb(229, 185, 185);
        background: rgb(30, 30, 30);
      }
      table {
        width: 80%;
        margin: auto;
        padding: 10px;
        font-size: 24px;
        border: 2px solid;
      }
      #data {
      }
      #data td {
        text-align: center;
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>S.no</th>
          <th>Title</th>
          <th>Image</th>
          <th>Price</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>
    <script>
      const ele = document.getElementById("data");
      const URL = "https://dummyjson.com/products";

      async function displayProduts() {
        try {
          const res = await fetch(URL);
          const data = await res.json();
          console.log("Data:", data.products);
          let row = "";
          data.products.map((i, ind) => {
            row += `<tr>
                <td>${ind + 1}</td>
                <td>${i.title}</td>
                <td><img src=${i.images[0]} width="100px"></td>
                <td>${i.price}</td>
                <td>${i.category}</td>
              </tr>`;
            ele.innerHTML = row;
          });
        } catch (err) {
          console.log("Error:", err);
          ele.innerHTML = `<tr>Network Error</tr>`;
        }
      }
      displayProduts();
    </script>
  </body>
</html>
