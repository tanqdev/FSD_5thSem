<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const num = [1, 2, 3, 4, 5, 6];
      const even = num.filter((el) => el % 2 == 0);
      const square = even.map((el) => el ** 2);
      const sum = square.reduce((acc, num) => {
        return acc + num;
      }, 0);
      console.log(num);
      console.log(even);
      console.log(square);
      console.log(sum);
    </script>
  </body>
</html>
